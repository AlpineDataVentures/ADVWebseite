<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
<title id="t">Die drei Stufen der Deckungsbeitragsrechnung</title>
<desc id="d">Nettoumsatz minus variable Kosten ergibt Deckungsbeitrag I, minus kundenfixe Kosten Deckungsbeitrag II, minus bereichsfixe Kosten Deckungsbeitrag III.</desc>
<style>
text{font-family:Poppins,"Segoe UI",Arial,sans-serif;fill:#141414}
.h{font-size:30px;font-weight:600}.s{font-size:18px;fill:#555555}.l{font-size:22px;font-weight:600}.m{font-size:18px;fill:#555555}.t{font-size:18px}
</style>
<rect width="1200" height="560" fill="#ffffff"/>
<text x="48" y="64" class="h">Vom Umsatz zum Deckungsbeitrag in drei Stufen</text>
<text x="48" y="96" class="s">Jede Stufe zieht eine weitere Kostenart ab</text>
<rect x="48" y="400" width="340" height="100" rx="8" fill="#ffffff" stroke="#141414" stroke-width="2"/>
<text x="68" y="440" class="l">Nettoumsatz</text><text x="68" y="470" class="m">Brutto minus Rabatte, Boni</text>
<rect x="388" y="320" width="240" height="180" rx="8" fill="#0c8974"/>
<text x="408" y="360" class="l" style="fill:#ffffff">DB I</text><text x="408" y="392" class="t" style="fill:#ffffff">nach variablen</text><text x="408" y="416" class="t" style="fill:#ffffff">Kosten</text>
<rect x="628" y="240" width="240" height="260" rx="8" fill="#00ce7f"/>
<text x="648" y="280" class="l">DB II</text><text x="648" y="312" class="t">nach kundenfixen</text><text x="648" y="336" class="t">Kosten</text><text x="648" y="380" class="m" style="fill:#141414">Wer verdient am Kunden?</text>
<rect x="868" y="160" width="240" height="340" rx="8" fill="#ffffff" stroke="#141414" stroke-width="2"/>
<text x="888" y="200" class="l">DB III</text><text x="888" y="232" class="t">nach bereichsfixen</text><text x="888" y="256" class="t">Kosten</text>
<text x="388" y="540" class="m">− variable Kosten</text><text x="628" y="540" class="m">− kundenfixe Kosten</text><text x="868" y="540" class="m">− bereichsfixe Kosten</text>
</svg>
