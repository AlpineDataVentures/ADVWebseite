<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d">
<title id="t">Fahrplan in 5 Stufen: Excel-Reporting im Controlling automatisieren</title>
<desc id="d">Treppe mit fünf Stufen von der Berichtsinventur über Definitionen, automatisierten Datenzugriff und ein zentrales Datenmodell bis zum automatisierten Bericht mit Verantwortlichem.</desc>
<style>
text{font-family:Poppins,"Segoe UI",Arial,sans-serif;fill:#141414}
.h{font-size:30px;font-weight:600}.s{font-size:18px;fill:#555555}
.n{font-size:20px;font-weight:600}.l{font-size:20px;font-weight:600}.m{font-size:16px;fill:#555555}
.w{font-size:16px;font-weight:600}
</style>
<rect width="1200" height="640" fill="#ffffff"/>
<text x="48" y="64" class="h">Excel-Reporting automatisieren: der Fahrplan</text>
<text x="48" y="96" class="s">Jede Stufe liefert für sich Nutzen – die Reihenfolge spart Umwege.</text>
<g>
<rect x="48" y="470" width="208" height="122" rx="20" fill="#f2f4f3" stroke="#141414" stroke-width="1.5"/>
<text x="68" y="506" class="n">1</text><text x="68" y="538" class="l">Inventur</text><text x="68" y="564" class="m">Welche Berichte</text><text x="68" y="584" class="m">steuern wirklich?</text>
<rect x="272" y="400" width="208" height="192" rx="20" fill="#f2f4f3" stroke="#141414" stroke-width="1.5"/>
<text x="292" y="436" class="n">2</text><text x="292" y="468" class="l">Definitionen</text><text x="292" y="494" class="m">Eine Kennzahl,</text><text x="292" y="514" class="m">eine Formel</text>
<rect x="496" y="330" width="208" height="262" rx="20" fill="#f2f4f3" stroke="#141414" stroke-width="1.5"/>
<text x="516" y="366" class="n">3</text><text x="516" y="398" class="l">Datenzugriff</text><text x="516" y="424" class="m">Abfragen statt</text><text x="516" y="444" class="m">Copy &amp; Paste</text>
<rect x="720" y="260" width="208" height="332" rx="20" fill="#f2f4f3" stroke="#141414" stroke-width="1.5"/>
<text x="740" y="296" class="n">4</text><text x="740" y="328" class="l">Datenmodell</text><text x="740" y="354" class="m">Eine Quelle für</text><text x="740" y="374" class="m">alle Berichte</text>
<rect x="944" y="190" width="208" height="402" rx="20" fill="#00ce7f" stroke="#141414" stroke-width="1.5"/>
<text x="964" y="226" class="n">5</text><text x="964" y="258" class="l">Automatisierter</text><text x="964" y="282" class="l">Bericht</text><text x="964" y="308" class="w" style="font-weight:400">Aktualisiert sich,</text><text x="964" y="328" class="w" style="font-weight:400">hat eine:n Owner</text>
</g>
<g class="m">
<text x="68" y="616" class="m">ca. 1 Woche</text><text x="292" y="616" class="m">1–2 Wochen</text><text x="516" y="616" class="m">2–4 Wochen</text><text x="740" y="616" class="m">4–8 Wochen</text><text x="964" y="616" class="m">laufend</text>
</g>
<text x="48" y="150" class="m">Zeitangaben: ADV-Erfahrungswerte für ein Controlling-Team</text>
<text x="48" y="170" class="m">mit 2–5 Personen im Mittelstand</text>
</svg>
