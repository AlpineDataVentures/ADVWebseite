<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d">
<title id="t">Entscheidungsbaum zur Vorauswahl des KI-Assistenten</title>
<desc id="d">Erst Datenschutz und Freigabe klären. Wer in Excel und Microsoft 365 arbeitet, startet mit Copilot. Sonst werden ChatGPT und Claude mit denselben Testaufgaben im Pilot verglichen.</desc>
<style>
text{font-family:Poppins,"Segoe UI",Arial,sans-serif;fill:#141414}
.h{font-size:30px;font-weight:600}.s{font-size:18px;fill:#555555}.q{font-size:20px;font-weight:600}.m{font-size:16px;fill:#555555}.j{font-size:16px;font-weight:600}
</style>
<rect width="1200" height="640" fill="#ffffff"/>
<text x="48" y="64" class="h">Welcher KI-Assistent passt zuerst?</text>
<text x="48" y="96" class="s">Vorauswahl, kein Ersatz für einen Pilot</text>
<rect x="48" y="150" width="440" height="100" rx="20" fill="#f2f4f3" stroke="#141414" stroke-width="1.5"/>
<text x="68" y="190" class="q">1 Datenschutz und Freigabe</text><text x="68" y="220" class="m">für Echtdaten geklärt?</text>
<line x1="488" y1="200" x2="640" y2="200" stroke="#141414" stroke-width="2"/>
<text x="530" y="188" class="j">Nein</text>
<rect x="640" y="150" width="512" height="100" rx="20" fill="#ffffff" stroke="#0c8974" stroke-width="2"/>
<text x="660" y="190" class="q">Zuerst klären</text><text x="660" y="220" class="m">Bis dahin nur Testdaten verwenden</text>
<line x1="268" y1="250" x2="268" y2="330" stroke="#141414" stroke-width="2"/>
<text x="284" y="296" class="j">Ja</text>
<rect x="48" y="330" width="440" height="100" rx="20" fill="#f2f4f3" stroke="#141414" stroke-width="1.5"/>
<text x="68" y="370" class="q">2 Team arbeitet vor allem</text><text x="68" y="400" class="m">in Excel und Microsoft 365?</text>
<line x1="488" y1="380" x2="640" y2="380" stroke="#141414" stroke-width="2"/>
<text x="530" y="368" class="j">Ja</text>
<rect x="640" y="330" width="512" height="100" rx="20" fill="#00ce7f" stroke="#141414" stroke-width="1.5"/>
<text x="660" y="370" class="q">Mit Copilot starten</text><text x="660" y="400" class="m" style="fill:#141414">Verfügbarkeit im Tenant prüfen</text>
<line x1="268" y1="430" x2="268" y2="510" stroke="#141414" stroke-width="2"/>
<text x="284" y="476" class="j">Nein</text>
<rect x="48" y="510" width="1104" height="100" rx="20" fill="#ffffff" stroke="#0c8974" stroke-width="2"/>
<text x="68" y="550" class="q">ChatGPT und Claude im Pilot vergleichen</text><text x="68" y="580" class="m">Dieselben drei Aufgaben, dieselben bereinigten Daten, Ergebnis nachrechnen</text>
</svg>
